# crypz API on the VPS (works with podman-compose and docker compose). Run from this folder:
#
#   podman compose run --rm migrate     # apply database migrations (every deploy)
#   podman compose up -d --build api    # build and (re)start crypz_api
#
# Caddy and Postgres already run in containers on one shared network. The api joins it and is reached by container
# name (crypz_api:3001); nothing is published on a host port, so it cannot collide with other projects.
# Set NETWORK in deploy/.env (see deploy/README.md for how to find it).

name: crypz

services:
  # One-off: applies pending Prisma migrations, then exits.
  migrate:
    build:
      context: ..
      dockerfile: packages/api/Dockerfile
      target: deps
    image: localhost/crypz_migrate:latest
    command: pnpm --filter @crypz/db migrate:deploy
    env_file: .env.api
    networks: [shared]
    restart: 'no'

  api:
    build:
      context: ..
      dockerfile: packages/api/Dockerfile
    image: localhost/crypz_api:latest
    container_name: crypz_api
    env_file: .env.api
    networks: [shared]
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'bun', '-e', "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  shared:
    external: true
    name: ${NETWORK:?set NETWORK in deploy/.env}
